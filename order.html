<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Menu</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<body class="bg-page">


<h1 class="menu-title">☕ Coffee Menu</h1>

<div class="menu">

    <div class="menu-item" data-price="120">
        <span>Espresso</span>
        <div class="price-option">
            <span>₹120</span>
            <button type="button" onclick="decrease(this)">-</button>
            <span class="qty">0</span>
            <button type="button" onclick="increase(this)">+</button>
        </div>
    </div>

    <div class="menu-item" data-price="200">
        <span>Bagalkot Special Cappuccino</span>
        <div class="price-option">
            <span>₹200</span>
            <button type="button" onclick="decrease(this)">-</button>
            <span class="qty">0</span>
            <button type="button" onclick="increase(this)">+</button>
        </div>
    </div>

    <div class="menu-item" data-price="150">
        <span>Cappuccino</span>
        <div class="price-option">
            <span>₹150</span>
            <button type="button" onclick="decrease(this)">-</button>
            <span class="qty">0</span>
            <button type="button" onclick="increase(this)">+</button>
        </div>
    </div>

    <div class="menu-item" data-price="160">
        <span>Latte</span>
        <div class="price-option">
            <span>₹160</span>
            <button type="button" onclick="decrease(this)">-</button>
            <span class="qty">0</span>
            <button type="button" onclick="increase(this)">+</button>
        </div>
    </div>

    <div class="menu-item" data-price="170">
        <span>Cold Coffee</span>
        <div class="price-option">
            <span>₹170</span>
            <button type="button" onclick="decrease(this)">-</button>
            <span class="qty">0</span>
            <button type="button" onclick="increase(this)">+</button>
        </div>
    </div>

    <div class="menu-item" data-price="180">
        <span>Mocha</span>
        <div class="price-option">
            <span>₹180</span>
            <button type="button" onclick="decrease(this)">-</button>
            <span class="qty">0</span>
            <button type="button" onclick="increase(this)">+</button>
        </div>
    </div>

</div>

<!-- Checkout Section -->
<div class="checkout">
    <h2>🧾 Checkout</h2>
    <p>Total Items: <span id="totalQty">0</span></p>
    <p>Total Amount: ₹<span id="totalCost">0</span></p>
    <button class="checkout-btn" onclick="goToPayment()">Place Order</button>
</div>


<!-- JavaScript (merged & clean) -->
<script>
function increase(btn) {
    const qtySpan = btn.previousElementSibling;
    qtySpan.textContent = parseInt(qtySpan.textContent) + 1;
    updateTotal();
}

function decrease(btn) {
    const qtySpan = btn.nextElementSibling;
    const qty = parseInt(qtySpan.textContent);
    if (qty > 0) {
        qtySpan.textContent = qty - 1;
        updateTotal();
    }
}

function updateTotal() {
    let totalQty = 0;
    let totalCost = 0;

    document.querySelectorAll('.menu-item').forEach(item => {
        const price = parseInt(item.dataset.price);
        const qty = parseInt(item.querySelector('.qty').textContent);

        totalQty += qty;
        totalCost += price * qty;
    });

    document.getElementById('totalQty').textContent = totalQty;
    document.getElementById('totalCost').textContent = totalCost;
}

function goToPayment() {
    const totalQty = parseInt(document.getElementById('totalQty').textContent);
    if (totalQty === 0) {
        alert("Please add at least one item to place order ☕");
    } else {
        window.location.href = "payment.html";
    }
}
</script>

</body>
</html>
